<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Causal Attention Mask</title><desc id="desc">Each position can attend only to itself and earlier positions.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2764d9"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#f6f9fc" stroke="#f6f9fc" stroke-width="1.5"/>
<text x="48" y="43" font-size="14" fill="#2764d9" font-weight="700" text-anchor="start">LLM INFERENCE / 01</text><text x="48" y="91" font-size="34" fill="#172b46" font-weight="700" text-anchor="start">Causal Attention Mask</text><text x="48" y="125" font-size="18" fill="#53677f" font-weight="400" text-anchor="start">Each position can attend only to itself and earlier positions.</text>
<path d="M48 150 H1152" stroke="#dce4ed"/><text x="115" y="200" font-size="18" fill="#53677f" font-weight="400" text-anchor="start">Query token</text><text x="370" y="194" font-size="18" fill="#53677f" font-weight="400" text-anchor="start">Key token</text><text x="270" y="235" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle">A</text><text x="362" y="235" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle">B</text><text x="454" y="235" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle">C</text><text x="546" y="235" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle">D</text><text x="177" y="290" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle">A</text><rect x="232" y="256" width="76" height="60" rx="8" fill="#e5efff" stroke="#a8c5f0" stroke-width="1.5"/><text x="270" y="294" font-size="22" fill="#2764d9" font-weight="500" text-anchor="middle">0</text><rect x="324" y="256" width="76" height="60" rx="8" fill="#eef1f5" stroke="#dce3eb" stroke-width="1.5"/><text x="362" y="294" font-size="22" fill="#8492a4" font-weight="500" text-anchor="middle">−∞</text><rect x="416" y="256" width="76" height="60" rx="8" fill="#eef1f5" stroke="#dce3eb" stroke-width="1.5"/><text x="454" y="294" font-size="22" fill="#8492a4" font-weight="500" text-anchor="middle">−∞</text><rect x="508" y="256" width="76" height="60" rx="8" fill="#eef1f5" stroke="#dce3eb" stroke-width="1.5"/><text x="546" y="294" font-size="22" fill="#8492a4" font-weight="500" text-anchor="middle">−∞</text><text x="177" y="368" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle">B</text><rect x="232" y="334" width="76" height="60" rx="8" fill="#e5efff" stroke="#a8c5f0" stroke-width="1.5"/><text x="270" y="372" font-size="22" fill="#2764d9" font-weight="500" text-anchor="middle">0</text><rect x="324" y="334" width="76" height="60" rx="8" fill="#e5efff" stroke="#a8c5f0" stroke-width="1.5"/><text x="362" y="372" font-size="22" fill="#2764d9" font-weight="500" text-anchor="middle">0</text><rect x="416" y="334" width="76" height="60" rx="8" fill="#eef1f5" stroke="#dce3eb" stroke-width="1.5"/><text x="454" y="372" font-size="22" fill="#8492a4" font-weight="500" text-anchor="middle">−∞</text><rect x="508" y="334" width="76" height="60" rx="8" fill="#eef1f5" stroke="#dce3eb" stroke-width="1.5"/><text x="546" y="372" font-size="22" fill="#8492a4" font-weight="500" text-anchor="middle">−∞</text><text x="177" y="446" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle">C</text><rect x="232" y="412" width="76" height="60" rx="8" fill="#e5efff" stroke="#a8c5f0" stroke-width="1.5"/><text x="270" y="450" font-size="22" fill="#2764d9" font-weight="500" text-anchor="middle">0</text><rect x="324" y="412" width="76" height="60" rx="8" fill="#e5efff" stroke="#a8c5f0" stroke-width="1.5"/><text x="362" y="450" font-size="22" fill="#2764d9" font-weight="500" text-anchor="middle">0</text><rect x="416" y="412" width="76" height="60" rx="8" fill="#e5efff" stroke="#a8c5f0" stroke-width="1.5"/><text x="454" y="450" font-size="22" fill="#2764d9" font-weight="500" text-anchor="middle">0</text><rect x="508" y="412" width="76" height="60" rx="8" fill="#eef1f5" stroke="#dce3eb" stroke-width="1.5"/><text x="546" y="450" font-size="22" fill="#8492a4" font-weight="500" text-anchor="middle">−∞</text><text x="177" y="524" font-size="22" fill="#172b46" font-weight="600" text-anchor="middle">D</text><rect x="232" y="490" width="76" height="60" rx="8" fill="#e5efff" stroke="#a8c5f0" stroke-width="1.5"/><text x="270" y="528" font-size="22" fill="#2764d9" font-weight="500" text-anchor="middle">0</text><rect x="324" y="490" width="76" height="60" rx="8" fill="#e5efff" stroke="#a8c5f0" stroke-width="1.5"/><text x="362" y="528" font-size="22" fill="#2764d9" font-weight="500" text-anchor="middle">0</text><rect x="416" y="490" width="76" height="60" rx="8" fill="#e5efff" stroke="#a8c5f0" stroke-width="1.5"/><text x="454" y="528" font-size="22" fill="#2764d9" font-weight="500" text-anchor="middle">0</text><rect x="508" y="490" width="76" height="60" rx="8" fill="#e5efff" stroke="#a8c5f0" stroke-width="1.5"/><text x="546" y="528" font-size="22" fill="#2764d9" font-weight="500" text-anchor="middle">0</text><rect x="660" y="240" width="450" height="94" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="660" y="255" width="4" height="64" rx="2" fill="#2764d9"/><text x="680" y="276" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Use the past and the present</text><text x="680" y="305" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Future tokens are blocked.</text><text x="682" y="380" font-size="20" fill="#2764d9" font-weight="500" text-anchor="start">0  →  Keep the attention score</text><text x="682" y="424" font-size="20" fill="#53677f" font-weight="400" text-anchor="start">−∞  →  Zero weight after Softmax</text><rect x="660" y="474" width="450" height="85" rx="12" fill="#eaf6f5" stroke="#b8deda" stroke-width="1.5"/><text x="682" y="509" font-size="19" fill="#087f8c" font-weight="600" text-anchor="start">Example: token C can use A, B, C.</text><text x="682" y="540" font-size="19" fill="#087f8c" font-weight="400" text-anchor="start">It cannot use token D.</text><text x="232" y="608" font-size="18" fill="#53677f" font-weight="400" text-anchor="start">Add this mask before attention Softmax.</text>
<path d="M48 665 H1152" stroke="#dce4ed"/><text x="48" y="692" font-size="13" fill="#53677f" font-weight="600" text-anchor="start">DECODER-ONLY LANGUAGE MODEL</text><text x="1152" y="692" font-size="13" fill="#53677f" font-weight="600" text-anchor="end">INFERENCE BASICS</text></g></svg>