<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">The Full Inference Path</title><desc id="desc">From input text to the next token, then repeat.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2764d9"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1200" height="850" rx="0" fill="#f6f9fc" stroke="#f6f9fc" stroke-width="1.5"/>
<text x="48" y="43" font-size="14" fill="#2764d9" font-weight="700" text-anchor="start">LLM INFERENCE / 01</text><text x="48" y="91" font-size="34" fill="#172b46" font-weight="700" text-anchor="start">The Full Inference Path</text><text x="48" y="125" font-size="18" fill="#53677f" font-weight="400" text-anchor="start">From input text to the next token, then repeat.</text>
<path d="M48 150 H1152" stroke="#dce4ed"/><text x="48" y="200" font-size="15" fill="#2764d9" font-weight="700" text-anchor="start">01 / PREPARE INPUT</text><rect x="48" y="218" width="310" height="82" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="48" y="233" width="4" height="52" rx="2" fill="#2764d9"/><text x="68" y="254" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Text</text><text x="68" y="283" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">User input</text><path d="M358 259 H397" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="410" y="218" width="310" height="82" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="410" y="233" width="4" height="52" rx="2" fill="#2764d9"/><text x="430" y="254" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Tokenizer</text><text x="430" y="283" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Text → Token IDs</text><path d="M720 259 H760" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="775" y="218" width="377" height="82" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="775" y="233" width="4" height="52" rx="2" fill="#2764d9"/><text x="795" y="254" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Embedding</text><text x="795" y="283" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Token IDs → vectors</text><path d="M963 300 V343 H345 V387" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="48" y="368" font-size="15" fill="#2764d9" font-weight="700" text-anchor="start">02 / RUN THE MODEL</text><rect x="48" y="398" width="310" height="88" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="48" y="413" width="4" height="58" rx="2" fill="#2764d9"/><text x="68" y="434" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Transformer layers</text><text x="68" y="463" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Use context + position</text><path d="M358 442 H397" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="410" y="398" width="310" height="88" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="410" y="413" width="4" height="58" rx="2" fill="#2764d9"/><text x="430" y="434" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Last hidden state</text><text x="430" y="463" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Last position → next token</text><path d="M720 442 H760" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="775" y="398" width="377" height="88" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="775" y="413" width="4" height="58" rx="2" fill="#2764d9"/><text x="795" y="434" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">LM Head</text><text x="795" y="463" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Hidden state → logits</text><path d="M963 486 V529 H345 V573" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="48" y="554" font-size="15" fill="#2764d9" font-weight="700" text-anchor="start">03 / CHOOSE AND CONTINUE</text><rect x="48" y="584" width="310" height="92" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="48" y="599" width="4" height="62" rx="2" fill="#2764d9"/><text x="68" y="620" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Sampling</text><text x="68" y="649" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Logits → next Token ID</text><path d="M358 630 H397" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="410" y="584" width="310" height="92" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="410" y="599" width="4" height="62" rx="2" fill="#2764d9"/><text x="430" y="620" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Append Token ID</text><text x="430" y="649" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Continue until stop</text><path d="M720 630 H760" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="775" y="584" width="377" height="92" rx="12" fill="#eaf6f5" stroke="#ccd8e5" stroke-width="1.5"/><rect x="775" y="599" width="4" height="62" rx="2" fill="#087f8c"/><text x="795" y="620" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Decode IDs</text><text x="795" y="649" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Show output text</text><text x="48" y="725" font-size="20" fill="#172b46" font-weight="500" text-anchor="start">Repeat with the new Token ID; reuse KV Cache when available.</text><text x="48" y="755" font-size="18" fill="#53677f" font-weight="400" text-anchor="start">Position handling and Transformer internals are simplified here.</text>
<path d="M48 795 H1152" stroke="#dce4ed"/><text x="48" y="822" font-size="13" fill="#53677f" font-weight="600" text-anchor="start">DECODER-ONLY LANGUAGE MODEL</text><text x="1152" y="822" font-size="13" fill="#53677f" font-weight="600" text-anchor="end">INFERENCE BASICS</text></g></svg>