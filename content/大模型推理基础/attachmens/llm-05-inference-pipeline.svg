<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="968" viewBox="0 0 1400 968" role="img" aria-labelledby="title desc">
<title id="title">The Full Inference Path</title><desc id="desc">From text to the next token — then repeat</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#16191f"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#0869d9"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif"><text x="700" y="55" font-size="39" font-weight="700" fill="#16191f" text-anchor="middle">The Full Inference Path</text><text x="700" y="97" font-size="25" font-weight="400" fill="#16191f" text-anchor="middle">From text to the next token — then repeat</text>
<rect x="24" y="132" width="1352" height="210" rx="5" fill="white" stroke="#828a96" stroke-width="1.5" stroke-dasharray="8 5"/><text x="44" y="171" font-size="28" font-weight="700" fill="#16191f" text-anchor="start">1. Prepare the Input</text><rect x="70" y="221" width="220" height="66" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="180.0" y="262.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Text</text><path d="M290 254 H369" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="382" y="221" width="230" height="66" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="497.0" y="262.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Tokenizer</text><path d="M612 254 H691" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="704" y="221" width="230" height="66" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="819.0" y="262.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Token IDs</text><path d="M934 254 H1013" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1026" y="221" width="290" height="66" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="1171.0" y="262.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Embedding</text><rect x="24" y="365" width="1352" height="210" rx="5" fill="white" stroke="#828a96" stroke-width="1.5" stroke-dasharray="8 5"/><text x="44" y="404" font-size="28" font-weight="700" fill="#16191f" text-anchor="start">2. Run the Model</text><rect x="70" y="452" width="270" height="66" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="205.0" y="493.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Transformer layers</text><path d="M340 485 H414" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="426" y="452" width="295" height="66" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="573.5" y="493.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Last hidden state</text><path d="M721 485 H795" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="807" y="452" width="220" height="66" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="917.0" y="493.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">LM Head</text><path d="M1027 485 H1100" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1112" y="452" width="205" height="66" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="1214.5" y="493.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Logits</text><path d="M1171 287 V354 H12 V485 H64" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="598" width="1352" height="240" rx="5" fill="white" stroke="#828a96" stroke-width="1.5" stroke-dasharray="8 5"/><text x="44" y="637" font-size="28" font-weight="700" fill="#16191f" text-anchor="start">3. Select a Token and Continue</text><rect x="70" y="683" width="270" height="66" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="205.0" y="724.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Sampling</text><path d="M340 716 H414" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="426" y="683" width="295" height="66" rx="5" fill="#dfedfc" stroke="#0869d9" stroke-width="1.5"/><text x="573.5" y="724.0" font-size="23" font-weight="400" fill="#0869d9" text-anchor="middle">Next Token ID</text><path d="M721 716 H795" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="807" y="683" width="220" height="66" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="917.0" y="724.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Decode IDs</text><path d="M1027 716 H1100" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1112" y="683" width="205" height="66" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="1214.5" y="724.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Output text</text><path d="M1214 518 V586 H12 V716 H64" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><text x="700" y="803" font-size="21" font-weight="400" fill="#16191f" text-anchor="middle">Temperature / Top-K / Top-P control token choice; Softmax gives probabilities.</text><rect x="24" y="860" width="1352" height="82" rx="5" fill="white" stroke="#939ba6" stroke-width="1.5" stroke-dasharray="8 5"/><text x="40" y="891" font-size="21" font-weight="400" fill="#16191f" text-anchor="start">Continue: append the new Token ID to the context and run the next model step.</text><text x="40" y="920" font-size="21" font-weight="400" fill="#16191f" text-anchor="start">Reuse KV Cache when available. Stop at EOS or the output limit.</text></g>
</svg>
