<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
<title id="title">Autoregressive Generation</title><desc id="desc">Predict one token, add it to the context, and repeat</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#16191f"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#0869d9"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif"><text x="700" y="55" font-size="39" font-weight="700" fill="#16191f" text-anchor="middle">Autoregressive Generation</text><text x="700" y="97" font-size="25" font-weight="400" fill="#16191f" text-anchor="middle">Predict one token, add it to the context, and repeat</text>
<rect x="24" y="132" width="1352" height="338" rx="5" fill="white" stroke="#828a96" stroke-width="1.5" stroke-dasharray="8 5"/><text x="44" y="171" font-size="28" font-weight="700" fill="#16191f" text-anchor="start">1. The Context Grows One Token at a Time</text><text x="55" y="220" font-size="22" font-weight="700" fill="#16191f" text-anchor="start">Step</text><text x="260" y="220" font-size="22" font-weight="700" fill="#16191f" text-anchor="start">Current context</text><text x="1130" y="220" font-size="22" font-weight="700" fill="#16191f" text-anchor="start">Next token</text><text x="77" y="281" font-size="24" font-weight="400" fill="#16191f" text-anchor="middle">1</text><rect x="165" y="246" width="220" height="48" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="275.0" y="278.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Prompt</text><path d="M385 270 H1102" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="246" width="215" height="48" rx="5" fill="#dfedfc" stroke="#0869d9" stroke-width="1.5"/><text x="1222.5" y="278.0" font-size="23" font-weight="400" fill="#0869d9" text-anchor="middle">Token 1</text><text x="77" y="346" font-size="24" font-weight="400" fill="#16191f" text-anchor="middle">2</text><rect x="165" y="311" width="220" height="48" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="275.0" y="343.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Prompt</text><rect x="415" y="311" width="220" height="48" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="525.0" y="343.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Token 1</text><path d="M635 335 H1102" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="311" width="215" height="48" rx="5" fill="#dfedfc" stroke="#0869d9" stroke-width="1.5"/><text x="1222.5" y="343.0" font-size="23" font-weight="400" fill="#0869d9" text-anchor="middle">Token 2</text><text x="77" y="411" font-size="24" font-weight="400" fill="#16191f" text-anchor="middle">3</text><rect x="165" y="376" width="220" height="48" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="275.0" y="408.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Prompt</text><rect x="415" y="376" width="220" height="48" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="525.0" y="408.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Token 1</text><rect x="665" y="376" width="220" height="48" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="775.0" y="408.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Token 2</text><path d="M885 400 H1102" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="376" width="215" height="48" rx="5" fill="#dfedfc" stroke="#0869d9" stroke-width="1.5"/><text x="1222.5" y="408.0" font-size="23" font-weight="400" fill="#0869d9" text-anchor="middle">Token 3</text><rect x="24" y="492" width="1352" height="328" rx="5" fill="white" stroke="#828a96" stroke-width="1.5" stroke-dasharray="8 5"/><text x="44" y="531" font-size="28" font-weight="700" fill="#16191f" text-anchor="start">2. Repeat Until a Stop Condition</text><rect x="55" y="580" width="255" height="66" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="182.5" y="621.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Current context</text><path d="M310 613 H369" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="382" y="580" width="270" height="66" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="517.0" y="621.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Predict next token</text><path d="M652 613 H711" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="724" y="580" width="260" height="66" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="854.0" y="621.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Stop condition?</text><path d="M984 613 H1130" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><text x="1052" y="594" font-size="21" font-weight="400" fill="#16191f" text-anchor="middle">Yes</text><rect x="1142" y="580" width="190" height="66" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="1237.0" y="621.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Finish</text><path d="M854 646 V723 H653" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><text x="888" y="685" font-size="21" font-weight="400" fill="#16191f" text-anchor="start">No</text><rect x="382" y="696" width="258" height="54" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="511.0" y="731.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Append Token ID</text><path d="M382 723 H182 V651" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><text x="700" y="791" font-size="22" font-weight="400" fill="#16191f" text-anchor="middle">Stop at EOS or the output limit. KV Cache can reuse past keys and values.</text></g>
</svg>
