<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Autoregressive Generation</title><desc id="desc">Use each new token to help predict the next one.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2764d9"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#f6f9fc" stroke="#f6f9fc" stroke-width="1.5"/>
<text x="48" y="43" font-size="14" fill="#2764d9" font-weight="700" text-anchor="start">LLM INFERENCE / 01</text><text x="48" y="91" font-size="34" fill="#172b46" font-weight="700" text-anchor="start">Autoregressive Generation</text><text x="48" y="125" font-size="18" fill="#53677f" font-weight="400" text-anchor="start">Use each new token to help predict the next one.</text>
<path d="M48 150 H1152" stroke="#dce4ed"/><rect x="48" y="216" width="305" height="95" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="48" y="231" width="4" height="65" rx="2" fill="#2764d9"/><text x="68" y="252" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Current context</text><text x="68" y="281" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Prompt + generated tokens</text><path d="M353 264 H392" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="405" y="216" width="335" height="95" rx="12" fill="#eaf1ff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="405" y="231" width="4" height="65" rx="2" fill="#2764d9"/><text x="425" y="252" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Predict next token</text><text x="425" y="281" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Run model + choose token</text><path d="M740 264 H779" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="792" y="216" width="360" height="95" rx="12" fill="#eaf6f5" stroke="#ccd8e5" stroke-width="1.5"/><rect x="792" y="231" width="4" height="65" rx="2" fill="#087f8c"/><text x="812" y="252" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">New Token ID</text><text x="812" y="281" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">One new token per step</text><path d="M972 311 V387" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="792" y="400" width="360" height="95" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="792" y="415" width="4" height="65" rx="2" fill="#2764d9"/><text x="812" y="436" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Stop condition?</text><text x="812" y="465" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">EOS or output limit</text><path d="M792 448 H744" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="750" y="427" font-size="18" fill="#2764d9" font-weight="600" text-anchor="start">No</text><rect x="405" y="400" width="325" height="95" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="405" y="415" width="4" height="65" rx="2" fill="#2764d9"/><text x="425" y="436" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Append token</text><text x="425" y="465" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Add its ID to the context</text><path d="M405 449 H200 V323" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="210" y="426" font-size="18" fill="#2764d9" font-weight="600" text-anchor="start">Repeat</text><path d="M972 495 V562" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="993" y="535" font-size="18" fill="#2764d9" font-weight="600" text-anchor="start">Yes</text><text x="972" y="597" font-size="24" fill="#087f8c" font-weight="600" text-anchor="middle">Finish</text><text x="48" y="577" font-size="18" fill="#53677f" font-weight="400" text-anchor="start">KV Cache can reuse past attention keys and values.</text><text x="48" y="607" font-size="18" fill="#53677f" font-weight="400" text-anchor="start">The loop shows the logical flow, not full recomputation.</text>
<path d="M48 665 H1152" stroke="#dce4ed"/><text x="48" y="692" font-size="13" fill="#53677f" font-weight="600" text-anchor="start">DECODER-ONLY LANGUAGE MODEL</text><text x="1152" y="692" font-size="13" fill="#53677f" font-weight="600" text-anchor="end">INFERENCE BASICS</text></g></svg>