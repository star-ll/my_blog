<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
<title id="title">From Text to Token IDs to Vectors</title><desc id="desc">Tokenization gives IDs; Embedding gives learned vectors</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#16191f"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#0869d9"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif"><text x="700" y="55" font-size="39" font-weight="700" fill="#16191f" text-anchor="middle">From Text to Token IDs to Vectors</text><text x="700" y="97" font-size="25" font-weight="400" fill="#16191f" text-anchor="middle">Tokenization gives IDs; Embedding gives learned vectors</text>
<rect x="24" y="132" width="1352" height="260" rx="5" fill="white" stroke="#828a96" stroke-width="1.5" stroke-dasharray="8 5"/><text x="44" y="171" font-size="28" font-weight="700" fill="#16191f" text-anchor="start">1. Tokenization: Text to Token IDs</text><rect x="52" y="224" width="235" height="62" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="169.5" y="263.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">&quot;I like Rust&quot;</text><path d="M287 255 H338" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="224" width="220" height="62" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="460.0" y="263.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Tokenizer</text><path d="M570 255 H621" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="634" y="213" width="200" height="54" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="734.0" y="248.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">I</text><path d="M734 267 V304" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><text x="734" y="337" font-size="27" font-weight="700" fill="#16191f" text-anchor="middle">41</text><rect x="866" y="213" width="200" height="54" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="966.0" y="248.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">like</text><path d="M966 267 V304" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><text x="966" y="337" font-size="27" font-weight="700" fill="#16191f" text-anchor="middle">87</text><rect x="1098" y="213" width="200" height="54" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="1198.0" y="248.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Rust</text><path d="M1198 267 V304" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><text x="1198" y="337" font-size="27" font-weight="700" fill="#16191f" text-anchor="middle">203</text><text x="52" y="365" font-size="21" font-weight="400" fill="#68717e" text-anchor="start">Example only: token splits and IDs depend on the tokenizer.</text><rect x="24" y="414" width="680" height="398" rx="5" fill="white" stroke="#828a96" stroke-width="1.5" stroke-dasharray="8 5"/><text x="44" y="453" font-size="28" font-weight="700" fill="#16191f" text-anchor="start">2. Embedding: Look Up a Learned Vector</text><rect x="726" y="414" width="650" height="398" rx="5" fill="white" stroke="#828a96" stroke-width="1.5" stroke-dasharray="8 5"/><text x="746" y="453" font-size="28" font-weight="700" fill="#16191f" text-anchor="start">3. Vectors Go into the Transformer</text><rect x="48" y="562" width="154" height="60" rx="5" fill="#dfedfc" stroke="#0869d9" stroke-width="1.5"/><text x="125.0" y="600.0" font-size="23" font-weight="400" fill="#0869d9" text-anchor="middle">ID 87</text><path d="M202 592 H240" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><text x="287" y="498" font-size="20" font-weight="700" fill="#16191f" text-anchor="middle">ID</text><text x="500" y="498" font-size="20" font-weight="700" fill="#16191f" text-anchor="middle">Embedding vector</text><rect x="252" y="514" width="424" height="53" rx="0" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="283" y="548" font-size="22" font-weight="400" fill="#16191f" text-anchor="middle">41</text><text x="339" y="548" font-size="21" font-weight="400" fill="#16191f" text-anchor="start">[ 0.12, −0.37, 0.81, … ]</text><rect x="252" y="567" width="424" height="53" rx="0" fill="#dfedfc" stroke="#16191f" stroke-width="1.5"/><text x="283" y="601" font-size="22" font-weight="400" fill="#16191f" text-anchor="middle">87</text><text x="339" y="601" font-size="21" font-weight="400" fill="#16191f" text-anchor="start">[ 0.64,  0.09, −0.22, … ]</text><rect x="252" y="620" width="424" height="53" rx="0" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="283" y="654" font-size="22" font-weight="400" fill="#16191f" text-anchor="middle">203</text><text x="339" y="654" font-size="21" font-weight="400" fill="#16191f" text-anchor="start">[ −0.18, 0.53, 0.46, … ]</text><rect x="44" y="707" width="640" height="82" rx="5" fill="white" stroke="#939ba6" stroke-width="1.5" stroke-dasharray="8 5"/><text x="60" y="738" font-size="21" font-weight="400" fill="#16191f" text-anchor="start">An ID is an index. Its value is not a meaning.</text><text x="60" y="767" font-size="21" font-weight="400" fill="#16191f" text-anchor="start">Each table row is a vector learned in training.</text><rect x="752" y="514" width="130" height="40" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="817.0" y="542.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Vector 1</text><path d="M882 534 H950" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="752" y="566" width="130" height="40" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="817.0" y="594.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Vector 2</text><path d="M882 586 H950" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="752" y="618" width="130" height="40" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="817.0" y="646.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Vector 3</text><path d="M882 638 H950" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="962" y="514" width="376" height="144" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="1150" y="570" font-size="29" font-weight="700" fill="#16191f" text-anchor="middle">Transformer</text><text x="1150" y="610" font-size="22" font-weight="400" fill="#16191f" text-anchor="middle">Uses context + position</text><rect x="746" y="707" width="610" height="82" rx="5" fill="white" stroke="#939ba6" stroke-width="1.5" stroke-dasharray="8 5"/><text x="762" y="738" font-size="21" font-weight="400" fill="#16191f" text-anchor="start">The model works with vectors, not raw text.</text><text x="762" y="767" font-size="21" font-weight="400" fill="#16191f" text-anchor="start">Vector values here are illustrative.</text></g>
</svg>
