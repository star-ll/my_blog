<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">From Text to Vectors</title><desc id="desc">Tokenization produces IDs. Embedding maps each ID to a vector.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2764d9"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#f6f9fc" stroke="#f6f9fc" stroke-width="1.5"/>
<text x="48" y="43" font-size="14" fill="#2764d9" font-weight="700" text-anchor="start">LLM INFERENCE / 01</text><text x="48" y="91" font-size="34" fill="#172b46" font-weight="700" text-anchor="start">From Text to Vectors</text><text x="48" y="125" font-size="18" fill="#53677f" font-weight="400" text-anchor="start">Tokenization produces IDs. Embedding maps each ID to a vector.</text>
<path d="M48 150 H1152" stroke="#dce4ed"/><rect x="48" y="207" width="315" height="92" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="48" y="222" width="4" height="62" rx="2" fill="#2764d9"/><text x="68" y="243" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Text</text><text x="68" y="272" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">&quot;I like Rust&quot;</text><path d="M363 253 H408" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="420" y="207" width="315" height="92" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="420" y="222" width="4" height="62" rx="2" fill="#2764d9"/><text x="440" y="243" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Tokenizer</text><text x="440" y="272" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Split text and look up IDs</text><path d="M735 253 H780" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="792" y="207" width="360" height="92" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="792" y="222" width="4" height="62" rx="2" fill="#2764d9"/><text x="812" y="243" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Token IDs</text><text x="812" y="272" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">[41, 87, 203]</text><path d="M972 299 V350 H600 V390" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="420" y="400" width="350" height="110" rx="12" fill="#eaf1ff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="420" y="415" width="4" height="80" rx="2" fill="#2764d9"/><text x="440" y="436" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Embedding lookup</text><text x="440" y="465" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Read one learned row per ID</text><rect x="48" y="400" width="310" height="110" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="48" y="415" width="4" height="80" rx="2" fill="#2764d9"/><text x="68" y="436" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Embedding table</text><text x="68" y="465" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Rows = vocabulary tokens</text><path d="M358 455 H407" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M770 455 H815" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="827" y="400" width="325" height="110" rx="12" fill="#eaf6f5" stroke="#ccd8e5" stroke-width="1.5"/><rect x="827" y="415" width="4" height="80" rx="2" fill="#087f8c"/><text x="847" y="436" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Token vectors</text><text x="847" y="465" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">One vector per token</text><text x="48" y="582" font-size="21" fill="#172b46" font-weight="600" text-anchor="start">Token ID = an index</text><text x="420" y="582" font-size="21" fill="#172b46" font-weight="600" text-anchor="start">Embedding = a learned vector</text><text x="48" y="617" font-size="18" fill="#53677f" font-weight="400" text-anchor="start">Example split and IDs are illustrative; real values depend on the tokenizer.</text>
<path d="M48 665 H1152" stroke="#dce4ed"/><text x="48" y="692" font-size="13" fill="#53677f" font-weight="600" text-anchor="start">DECODER-ONLY LANGUAGE MODEL</text><text x="1152" y="692" font-size="13" fill="#53677f" font-weight="600" text-anchor="end">INFERENCE BASICS</text></g></svg>