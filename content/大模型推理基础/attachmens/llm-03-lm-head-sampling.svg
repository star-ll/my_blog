<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">From Hidden State to Next Token</title><desc id="desc">The output layer scores the vocabulary; the decoding rule selects a token.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#2764d9"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#f6f9fc" stroke="#f6f9fc" stroke-width="1.5"/>
<text x="48" y="43" font-size="14" fill="#2764d9" font-weight="700" text-anchor="start">LLM INFERENCE / 01</text><text x="48" y="91" font-size="34" fill="#172b46" font-weight="700" text-anchor="start">From Hidden State to Next Token</text><text x="48" y="125" font-size="18" fill="#53677f" font-weight="400" text-anchor="start">The output layer scores the vocabulary; the decoding rule selects a token.</text>
<path d="M48 150 H1152" stroke="#dce4ed"/><rect x="48" y="210" width="335" height="94" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="48" y="225" width="4" height="64" rx="2" fill="#2764d9"/><text x="68" y="246" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Last hidden state</text><text x="68" y="275" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Vector at the last position</text><path d="M383 257 H422" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="435" y="210" width="285" height="94" rx="12" fill="#eaf1ff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="435" y="225" width="4" height="64" rx="2" fill="#2764d9"/><text x="455" y="246" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">LM Head</text><text x="455" y="275" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Score every token</text><path d="M720 257 H762" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="775" y="210" width="377" height="94" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="775" y="225" width="4" height="64" rx="2" fill="#2764d9"/><text x="795" y="246" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Logits</text><text x="795" y="275" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">One raw score per token</text><path d="M963 304 V355 H202 V400" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="48" y="411" width="310" height="100" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="48" y="426" width="4" height="70" rx="2" fill="#2764d9"/><text x="68" y="447" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Temperature</text><text x="68" y="476" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Scale logits with T &gt; 0</text><path d="M358 461 H397" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="410" y="411" width="310" height="100" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><rect x="410" y="426" width="4" height="70" rx="2" fill="#2764d9"/><text x="430" y="447" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Softmax</text><text x="430" y="476" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Scores → probabilities</text><path d="M720 461 H762" fill="none" stroke="#2764d9" stroke-width="2.5" marker-end="url(#arrow)" stroke-linejoin="round"/><rect x="775" y="411" width="377" height="100" rx="12" fill="#eaf6f5" stroke="#ccd8e5" stroke-width="1.5"/><rect x="775" y="426" width="4" height="70" rx="2" fill="#087f8c"/><text x="795" y="447" font-size="22" fill="#172b46" font-weight="600" text-anchor="start">Sample</text><text x="795" y="476" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Choose the next Token ID</text><rect x="48" y="556" width="1104" height="71" rx="12" fill="#ffffff" stroke="#ccd8e5" stroke-width="1.5"/><text x="70" y="586" font-size="20" fill="#172b46" font-weight="500" text-anchor="start">Top-K / Top-P can narrow the choices before sampling.</text><text x="70" y="613" font-size="17" fill="#53677f" font-weight="400" text-anchor="start">Renormalize after filtering. Greedy decoding selects the highest score instead.</text>
<path d="M48 665 H1152" stroke="#dce4ed"/><text x="48" y="692" font-size="13" fill="#53677f" font-weight="600" text-anchor="start">DECODER-ONLY LANGUAGE MODEL</text><text x="1152" y="692" font-size="13" fill="#53677f" font-weight="600" text-anchor="end">INFERENCE BASICS</text></g></svg>