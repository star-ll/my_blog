<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
<title id="title">From Hidden State to the Next Token</title><desc id="desc">LM Head gives scores; the decoding rule picks a token</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#16191f"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#0869d9"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, Liberation Sans, DejaVu Sans, sans-serif"><text x="700" y="55" font-size="39" font-weight="700" fill="#16191f" text-anchor="middle">From Hidden State to the Next Token</text><text x="700" y="97" font-size="25" font-weight="400" fill="#16191f" text-anchor="middle">LM Head gives scores; the decoding rule picks a token</text>
<rect x="24" y="132" width="652" height="345" rx="5" fill="white" stroke="#828a96" stroke-width="1.5" stroke-dasharray="8 5"/><text x="44" y="171" font-size="28" font-weight="700" fill="#16191f" text-anchor="start">1. Use the Last Hidden State</text><rect x="696" y="132" width="680" height="345" rx="5" fill="white" stroke="#828a96" stroke-width="1.5" stroke-dasharray="8 5"/><text x="716" y="171" font-size="28" font-weight="700" fill="#16191f" text-anchor="start">2. LM Head Scores the Vocabulary</text><rect x="50" y="218" width="175" height="52" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="137.5" y="252.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Token 1</text><path d="M137 270 V303" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="315" width="175" height="56" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="137.5" y="351.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Hidden 1</text><rect x="257" y="218" width="175" height="52" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="344.5" y="252.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Token 2</text><path d="M344 270 V303" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="257" y="315" width="175" height="56" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="344.5" y="351.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Hidden 2</text><rect x="464" y="218" width="175" height="52" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="551.5" y="252.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Token 3</text><path d="M551 270 V303" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="464" y="315" width="175" height="56" rx="5" fill="#dfedfc" stroke="#0869d9" stroke-width="1.5"/><text x="551.5" y="351.0" font-size="23" font-weight="400" fill="#0869d9" text-anchor="middle">Hidden 3</text><text x="350" y="427" font-size="22" font-weight="400" fill="#16191f" text-anchor="middle">Use the last position to predict the next token.</text><rect x="720" y="244" width="180" height="64" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="810.0" y="284.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">LM Head</text><path d="M900 276 H954" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><text x="1000" y="211" font-size="21" font-weight="700" fill="#16191f" text-anchor="start">Token</text><text x="1275" y="211" font-size="21" font-weight="700" fill="#16191f" text-anchor="end">Logit</text><rect x="969" y="227" width="369" height="44" rx="0" fill="#dfedfc" stroke="#16191f" stroke-width="1.5"/><text x="990" y="256" font-size="22" font-weight="400" fill="#16191f" text-anchor="start">apple</text><text x="1316" y="256" font-size="22" font-weight="400" fill="#16191f" text-anchor="end">8.2</text><rect x="969" y="271" width="369" height="44" rx="0" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="990" y="300" font-size="22" font-weight="400" fill="#16191f" text-anchor="start">banana</text><text x="1316" y="300" font-size="22" font-weight="400" fill="#16191f" text-anchor="end">3.1</text><rect x="969" y="315" width="369" height="44" rx="0" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="990" y="344" font-size="22" font-weight="400" fill="#16191f" text-anchor="start">car</text><text x="1316" y="344" font-size="22" font-weight="400" fill="#16191f" text-anchor="end">−1.2</text><rect x="969" y="359" width="369" height="44" rx="0" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="990" y="388" font-size="22" font-weight="400" fill="#16191f" text-anchor="start">sky</text><text x="1316" y="388" font-size="22" font-weight="400" fill="#16191f" text-anchor="end">0.8</text><text x="1034" y="446" font-size="21" font-weight="400" fill="#16191f" text-anchor="middle">Toy vocabulary: one raw score per token.</text><rect x="24" y="498" width="1352" height="322" rx="5" fill="white" stroke="#828a96" stroke-width="1.5" stroke-dasharray="8 5"/><text x="44" y="537" font-size="28" font-weight="700" fill="#16191f" text-anchor="start">3. Turn Scores into a Choice</text><rect x="48" y="587" width="220" height="64" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="158.0" y="627.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Logits</text><path d="M268 619 H307" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="319" y="587" width="220" height="64" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="429.0" y="627.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Temperature</text><path d="M539 619 H578" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="590" y="587" width="220" height="64" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="700.0" y="627.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Softmax</text><path d="M810 619 H849" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="861" y="587" width="220" height="64" rx="5" fill="white" stroke="#16191f" stroke-width="1.5"/><text x="971.0" y="627.0" font-size="23" font-weight="400" fill="#16191f" text-anchor="middle">Sample</text><path d="M1081 619 H1120" fill="none" stroke="#16191f" stroke-width="2" marker-end="url(#arrow)"/><rect x="1132" y="587" width="220" height="64" rx="5" fill="#dfedfc" stroke="#0869d9" stroke-width="1.5"/><text x="1242.0" y="627.0" font-size="23" font-weight="400" fill="#0869d9" text-anchor="middle">Next Token ID</text><text x="428" y="686" font-size="20" font-weight="400" fill="#16191f" text-anchor="middle">Scale scores</text><text x="700" y="686" font-size="20" font-weight="400" fill="#16191f" text-anchor="middle">Get probabilities</text><text x="971" y="686" font-size="20" font-weight="400" fill="#16191f" text-anchor="middle">Choose one token</text><rect x="44" y="720" width="1312" height="82" rx="5" fill="white" stroke="#939ba6" stroke-width="1.5" stroke-dasharray="8 5"/><text x="60" y="751" font-size="21" font-weight="400" fill="#16191f" text-anchor="start">Top-K / Top-P can filter the choices before sampling; renormalize after filtering.</text><text x="60" y="780" font-size="21" font-weight="400" fill="#16191f" text-anchor="start">Greedy decoding selects the highest score. Temperature scaling assumes T &gt; 0.</text></g>
</svg>
